<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">mandate. An AI investment committee for UK charities</title>
<desc id="desc">The Mandate wordmark beside a committee ledger: four companies checked for ethics, financial health and risk, each with the Chair's decision. These are the app's four simulated demo scenarios.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#174a41"/>
    <stop offset=".55" stop-color="#123c35"/>
    <stop offset="1" stop-color="#0c2b26"/>
  </linearGradient>
  <radialGradient id="glow" cx=".14" cy=".08" r=".6">
    <stop offset="0" stop-color="#cee1a4" stop-opacity=".16"/>
    <stop offset="1" stop-color="#cee1a4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="lines" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-opacity=".025" stroke-width="10"/>
  </pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04110e" flood-opacity=".45"/>
  </filter>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace}
    .row{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
    .stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
    .tick{animation:fade .3s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes stamp{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
  </style>
</defs>

<rect width="1280" height="440" rx="20" fill="url(#bg)"/>
<rect width="1280" height="440" rx="20" fill="url(#lines)"/>
<rect width="1280" height="440" rx="20" fill="url(#glow)"/>
<rect x=".75" y=".75" width="1278.5" height="438.5" rx="19.5" fill="none" stroke="#95b7a2" stroke-opacity=".35" stroke-width="1.5"/>

<!-- left: wordmark -->
<g class="sans">
  <g transform="translate(64 86)">
    <rect width="320" height="28" rx="14" fill="#cee1a4" fill-opacity=".1" stroke="#cee1a4" stroke-opacity=".4"/>
    <text x="16" y="18.5" font-size="12" font-weight="600" letter-spacing="1.8" fill="#e2eabd">AI INVESTMENT COMMITTEE · UK CHARITIES</text>
  </g>
  <g transform="translate(64 140)">
    <rect width="66" height="74" fill="none" stroke="#95b7a2" stroke-width="1.5"/>
    <text class="serif" x="33" y="54" font-size="46" text-anchor="middle" fill="#e2eabd">M</text>
  </g>
  <text x="146" y="202" font-size="80" font-weight="700" letter-spacing="-5" fill="#ffffff">mandate<tspan fill="#cee1a4">.</tspan></text>
  <text x="64" y="262" font-size="21" fill="#d6e3da">Turn a charity's ethical investment policy into an</text>
  <text x="64" y="291" font-size="21" fill="#d6e3da">evidence-checked <tspan fill="#ffffff" font-weight="600">$100k paper portfolio</tspan>.</text>
  <g font-size="13.5" font-weight="600">
    <g transform="translate(64 326)">
      <rect width="170" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#95b7a2" stroke-opacity=".45"/>
      <circle cx="18" cy="17" r="4" fill="#cee1a4"/><text x="30" y="22" fill="#e9f0e6">3 specialist agents</text>
    </g>
    <g transform="translate(244 326)">
      <rect width="188" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#95b7a2" stroke-opacity=".45"/>
      <circle cx="18" cy="17" r="4" fill="#cee1a4"/><text x="30" y="22" fill="#e9f0e6">Every claim verified</text>
    </g>
    <g transform="translate(442 326)">
      <rect width="168" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#95b7a2" stroke-opacity=".45"/>
      <circle cx="18" cy="17" r="4" fill="#cee1a4"/><text x="30" y="22" fill="#e9f0e6">Ethics veto in code</text>
    </g>
  </g>
</g>

<!-- right: committee ledger -->
<g class="sans" filter="url(#shadow)">
  <rect x="676" y="52" width="540" height="348" rx="14" fill="#fffefa"/>
</g>
<g class="sans">
  <text x="704" y="88" font-size="12" font-weight="700" letter-spacing="1.6" fill="#166459">COMMITTEE LEDGER</text>
  <text x="1188" y="88" font-size="12" text-anchor="end" fill="#6b7f76">Simulated demo scenarios</text>
  <g font-size="11" font-weight="700" letter-spacing="1.2" fill="#6b7f76">
    <text x="704" y="124">COMPANY</text>
    <text x="846" y="124" text-anchor="middle">ETHICS</text>
    <text x="916" y="124" text-anchor="middle">FINANCE</text>
    <text x="984" y="124" text-anchor="middle">RISK</text>
    <text x="1188" y="124" text-anchor="end">CHAIR</text>
  </g>
  <text x="846" y="138" font-size="10" text-anchor="middle" fill="#9aa9a1">Melchior</text>
  <text x="916" y="138" font-size="10" text-anchor="middle" fill="#9aa9a1">Balthasar</text>
  <text x="984" y="138" font-size="10" text-anchor="middle" fill="#9aa9a1">Casper</text>
  <line x1="704" x2="1188" y1="150" y2="150" stroke="#d8e1d9"/>

  <!-- XYL -->
  <g class="row" style="animation-delay:.2s">
    <text x="704" y="186" font-size="18" font-weight="700" fill="#172d29">XYL</text>
    <text x="704" y="203" font-size="11.5" fill="#6b7f76">Xylem</text>
    <g class="tick" style="animation-delay:.45s"><circle cx="846" cy="186" r="12" fill="#e3f1df"/><path d="M840 186l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:.55s"><circle cx="916" cy="186" r="12" fill="#e3f1df"/><path d="M910 186l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:.65s"><circle cx="984" cy="186" r="12" fill="#e3f1df"/><path d="M978 186l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="stamp" style="animation-delay:.85s;transform-origin:1128px 186px">
      <rect x="1068" y="172" width="120" height="28" rx="6" fill="#e3f1df" stroke="#1f7a3f" stroke-opacity=".5"/>
      <text x="1128" y="191" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f6b39">Approved · 10%</text>
    </g>
  </g>
  <line x1="704" x2="1188" y1="214" y2="214" stroke="#ecf0ea"/>

  <!-- MSFT -->
  <g class="row" style="animation-delay:.5s">
    <text x="704" y="248" font-size="18" font-weight="700" fill="#172d29">MSFT</text>
    <text x="704" y="265" font-size="11.5" fill="#6b7f76">Microsoft</text>
    <g class="tick" style="animation-delay:.75s"><circle cx="846" cy="248" r="12" fill="#e3f1df"/><path d="M840 248l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:.85s"><circle cx="916" cy="248" r="12" fill="#e3f1df"/><path d="M910 248l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:.95s"><circle cx="984" cy="248" r="12" fill="#fbefd5"/><text x="984" y="253" font-size="15" font-weight="800" text-anchor="middle" fill="#9a6200">!</text></g>
    <g class="stamp" style="animation-delay:1.15s;transform-origin:1128px 248px">
      <rect x="1068" y="234" width="120" height="28" rx="6" fill="#fbefd5" stroke="#b7791f" stroke-opacity=".5"/>
      <text x="1128" y="253" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8a5a00">Capped · 5%</text>
    </g>
  </g>
  <line x1="704" x2="1188" y1="276" y2="276" stroke="#ecf0ea"/>

  <!-- PM -->
  <g class="row" style="animation-delay:.8s">
    <text x="704" y="310" font-size="18" font-weight="700" fill="#172d29">PM</text>
    <text x="704" y="327" font-size="11.5" fill="#6b7f76">Philip Morris</text>
    <g class="tick" style="animation-delay:1.05s"><circle cx="846" cy="310" r="12" fill="#f9e1df"/><path d="M841 305l10 10M851 305l-10 10" stroke="#b42318" stroke-width="2.4" stroke-linecap="round"/></g>
    <g class="tick" style="animation-delay:1.15s"><circle cx="916" cy="310" r="12" fill="#e3f1df"/><path d="M910 310l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:1.25s"><circle cx="984" cy="310" r="12" fill="#e3f1df"/><path d="M978 310l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="stamp" style="animation-delay:1.45s;transform-origin:1128px 310px">
      <rect x="1068" y="296" width="120" height="28" rx="6" fill="#f9e1df" stroke="#b42318" stroke-opacity=".5"/>
      <text x="1128" y="315" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9b1c13">Ethics veto</text>
    </g>
  </g>
  <line x1="704" x2="1188" y1="338" y2="338" stroke="#ecf0ea"/>

  <!-- MMM -->
  <g class="row" style="animation-delay:1.1s">
    <text x="704" y="366" font-size="18" font-weight="700" fill="#172d29">MMM</text>
    <text x="704" y="381" font-size="11.5" fill="#6b7f76">3M</text>
    <g class="tick" style="animation-delay:1.35s"><circle cx="846" cy="364" r="12" fill="#dfeaf4"/><text x="846" y="369.5" font-size="14" font-weight="800" text-anchor="middle" fill="#176a9d">?</text></g>
    <g class="tick" style="animation-delay:1.45s"><circle cx="916" cy="364" r="12" fill="#e3f1df"/><path d="M910 364l4 4 8-8" fill="none" stroke="#1f7a3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="tick" style="animation-delay:1.55s"><circle cx="984" cy="364" r="12" fill="#dfeaf4"/><text x="984" y="369.5" font-size="14" font-weight="800" text-anchor="middle" fill="#176a9d">?</text></g>
    <g class="stamp" style="animation-delay:1.75s;transform-origin:1128px 364px">
      <rect x="1068" y="350" width="120" height="28" rx="6" fill="#dfeaf4" stroke="#176a9d" stroke-opacity=".5"/>
      <text x="1128" y="369" font-size="12.5" font-weight="700" text-anchor="middle" fill="#145b87">Trustee review</text>
    </g>
  </g>
</g>
</svg>
